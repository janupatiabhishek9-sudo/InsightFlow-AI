[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insightflow-ai"
version = "0.1.0"
description = "InsightFlow AI - a governed agentic analytics platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=0.2",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "streamlit>=1.36",
    "plotly>=5.22",
    "sqlglot>=25",
    "mcp>=1.2",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Optional neural embeddings (ONNX, ~100 MB model, no torch). The default hashing embedder needs nothing.
embeddings = ["fastembed>=0.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: end-to-end tests that run the full graph"]
